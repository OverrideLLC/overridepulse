[package]
name = "overridepulse"
version = "0.2.0"
edition = "2021"
description = "Ultralightweight TUI for Android & Gradle development (Lazygit for Android developers)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/OverrideLLC/overridepulse"
homepage = "https://github.com/OverrideLLC/overridepulse"
documentation = "https://docs.rs/overridepulse"
authors = ["Override LLC <christopher.override@gmail.com>", "ChristopherTwo <christopher.override@gmail.com>"]
keywords = ["android", "adb", "gradle", "tui", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
